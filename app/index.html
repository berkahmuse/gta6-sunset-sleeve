<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Sleeve — Diagonal Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>SUNSET <span>SLEEVE</span></h1>
    <p class="tag">Diagonal slices. Duotone heat. Your photos, cut like a sleeve.</p>

    <label class="upload">Add photos (up to 6)
      <input id="files" type="file" accept="image/*" multiple>
    </label>
    <div id="thumbs" class="thumbs" aria-label="Photo library"></div>
    <p class="hint">Tap a photo, then tap a panel number to assign it. Drag on the cover to reposition the selected panel. Use the wheel or zoom slider to scale it.</p>

    <label>Selected panel
      <select id="panelSel"></select>
    </label>
    <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>

    <label>Title <input id="caption" type="text" maxlength="28" value="Vice Heat"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="42" value="NEON NIGHTS · PALM CITY"></label>

    <label>Layout
      <select id="layout">
        <option value="trio">Diagonal Trio — three slanted slices</option>
        <option value="strip">Film Strip — four angled frames</option>
        <option value="duo">Duo Split — two bold halves</option>
      </select>
    </label>
    <label>Grade
      <select id="grade">
        <option value="neon">Teal-Pink Neon</option>
        <option value="amber">Sunset Amber</option>
        <option value="ultra">Ultraviolet</option>
        <option value="mint">Mint Noir</option>
      </select>
    </label>
    <label>Export size
      <select id="size">
        <option value="1080x1080">Square 1080 × 1080</option>
        <option value="1080x1350">Portrait 1080 × 1350</option>
        <option value="1920x1080">Wide 1920 × 1080</option>
      </select>
    </label>
    <button id="export" type="button">Export PNG</button>
    <button id="shuffle" type="button" class="ghost">Shuffle samples</button>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="stage-hint">Drag the selected slice · scroll to zoom · everything stays on your device</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
